# HippoRAG Docker Compose
# Usage:
#   docker-compose up -d          # Start API service
#   docker-compose logs -f api    # View API logs
#   docker-compose down           # Stop API service
#
# Note: DGraph and pgvector are external services.
# Make sure they are running and accessible before starting the API.

services:
  # HippoRAG REST API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hipporag-api
    environment:
      # OpenAI API configuration
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      HIPPORAG_LLM_MODEL: ${HIPPORAG_LLM_MODEL:-gpt-4o-mini}
      HIPPORAG_EMBEDDING_MODEL: ${HIPPORAG_EMBEDDING_MODEL:-text-embedding-3-small}

      # DGraph configuration (external service)
      DGRAPH_GRPC: ${DGRAPH_GRPC:-localhost:9080}

      # pgvector configuration (external service)
      USE_PGVECTOR: ${USE_PGVECTOR:-true}
      PGVECTOR_HOST: ${PGVECTOR_HOST:-localhost}
      PGVECTOR_PORT: ${PGVECTOR_PORT:-5432}
      PGVECTOR_DATABASE: ${PGVECTOR_DATABASE:-hipporag}
      PGVECTOR_USER: ${PGVECTOR_USER:-hipporag}
      PGVECTOR_PASSWORD: ${PGVECTOR_PASSWORD:-hipporag}

      # Embedding batch size
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-10}

      # Save directory
      HIPPORAG_SAVE_DIR: /app/outputs
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./outputs:/app/outputs
    networks:
      - my-shared-network
    restart: unless-stopped

networks:
  my-shared-network:
    external: true
