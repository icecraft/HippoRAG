# HippoRAG Docker Compose
# Usage:
#   docker-compose up -d          # Start API service
#   docker-compose logs -f api    # View API logs
#   docker-compose down           # Stop API service
#
# Note: DGraph and pgvector are external services.
# Make sure they are running and accessible before starting the API.

services:


  # HippoRAG Frontend (React + Node.js)
  frontend:
    image: hipporag-frontend:dev
    container_name: hipporag-frontend
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL:-http://host.docker.internal:8000}
      - PORT=80
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - my-shared-network
    restart: unless-stopped


networks:
  my-shared-network:
    external: true
